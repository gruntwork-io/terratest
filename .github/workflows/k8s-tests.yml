name: Kubernetes Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  K8S_VERSION: "v1.28.0"

jobs:
  kubernetes-tests:
    name: Kubernetes Tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2025.12.10
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::087285199408:role/terratest-gha
          aws-region: us-east-1

      - name: Start minikube
        # The tests reach NodePort services through the node's hostname, which the runner cannot
        # resolve by itself, and the ingress test needs a controller to fill in the ingress status.
        run: |
          minikube start --driver=docker --kubernetes-version=${{ env.K8S_VERSION }}
          minikube addons enable ingress
          echo "$(minikube ip) minikube" | sudo tee -a /etc/hosts

      - name: Run k8s module tests
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          go test -v -tags kubernetes -count=1 -timeout 20m ./modules/k8s/... 2>&1 | tee /tmp/logs/test_output.log

      - name: Run k8s integration tests
        run: |
          set -o pipefail
          go test -v -tags kubernetes -run TestKubernetes -count=1 -timeout 20m ./test/... 2>&1 | tee -a /tmp/logs/test_output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-test-logs
          path: /tmp/logs/
          retention-days: 14

  helm-tests:
    name: Helm Tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2025.12.10
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::087285199408:role/terratest-gha
          aws-region: us-east-1

      - name: Start minikube
        # The tests reach NodePort services through the node's hostname, which the runner cannot
        # resolve by itself.
        run: |
          minikube start --driver=docker --kubernetes-version=${{ env.K8S_VERSION }}
          echo "$(minikube ip) minikube" | sudo tee -a /etc/hosts

      - name: Run helm module tests
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          go test -v -tags helm -count=1 -timeout 20m ./modules/helm/... 2>&1 | tee /tmp/logs/test_output.log

      - name: Run helm integration tests
        run: |
          set -o pipefail
          go test -v -tags helm -run TestHelm -count=1 -timeout 20m ./test/... 2>&1 | tee -a /tmp/logs/test_output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-test-logs
          path: /tmp/logs/
          retention-days: 14
